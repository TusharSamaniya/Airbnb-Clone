name: Java CI/CD with Maven and AWS

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'corretto'

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Deploy to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "target/AirbnbCloneProject-0.0.1-SNAPSHOT.jar"
        target: "~/"

    - name: Restart App on EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Kill the old process
          sudo pkill -f 'java -jar' || true
          # Start the new one in the background
          nohup java -jar ~/target/AirbnbCloneProject-0.0.1-SNAPSHOT.jar --spring.datasource.password="Tushar_2004" --spring.datasource.url="jdbc:mysql://airbnb-db.ctaym0yequzi.ap-south-1.rds.amazonaws.com:3306/airbnb_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC" > app.log 2>&1 &