<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb Clone - Find Your Perfect Stay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .property-card {
            transition: transform 0.3s;
            cursor: pointer;
        }
        .property-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .property-img {
            height: 250px;
            object-fit: cover;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }
        .fallback-img {
            height: 250px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Airbnb Clone</a>
            <div class="d-flex">
                <a href="/login.html" class="btn btn-outline-light me-2">Login</a>
                <a href="/register.html" class="btn btn-light">Sign Up</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section with Search Bar -->
    <div class="bg-primary text-white py-5">
        <div class="container">
            <h1 class="display-4 text-center mb-4">Find Your Perfect Stay</h1>
            <p class="lead text-center mb-5">Discover amazing places to stay around the world</p>

            <!-- Search Form -->
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <form id="searchForm" class="bg-white rounded shadow p-4">
                        <div class="row g-3 align-items-center">
                            <div class="col-md-5">
                                <input type="text" class="form-control form-control-lg" id="searchLocation" 
                                       placeholder="Where to? (e.g., Goa, Mumbai, Delhi)" autocomplete="off">
                            </div>
                            <div class="col-md-3">
                                <input type="number" class="form-control form-control-lg" id="searchGuests" 
                                       placeholder="Guests" min="1">
                            </div>
                            <div class="col-md-4">
                                <button type="submit" class="btn btn-danger btn-lg w-100 h-100">
                                    🔍 Search
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Properties Grid -->
    <div class="container my-5">
        <h2 class="text-center mb-4">Available Properties</h2>
        <div class="row" id="propertiesContainer">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allProperties = [];  // Store all properties for client-side filtering

        // Load all properties on page load
        async function loadAllProperties() {
            try {
                const response = await fetch('/api/properties/all');
                allProperties = await response.json();
                displayProperties(allProperties);
            } catch (err) {
                document.getElementById('propertiesContainer').innerHTML = 
                    '<div class="alert alert-danger text-center">Error loading properties. Please try again later.</div>';
            }
        }

        // Display filtered or all properties
        function displayProperties(properties) {
            const container = document.getElementById('propertiesContainer');
            container.innerHTML = '';

            if (properties.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <h4>No properties found matching your search.</h4>
                        <p class="text-muted">Try adjusting your filters or be the first to list a property!</p>
                    </div>`;
                return;
            }

            properties.forEach(property => {
                const imageHtml = property.imageUrl 
                    ? `<img src="${property.imageUrl}" class="property-img card-img-top" alt="${property.title}">`
                    : `<div class="fallback-img">${property.title.substring(0, 2).toUpperCase()}</div>`;

                const card = `
                    <div class="col-md-4 mb-4">
                        <div class="card property-card h-100 shadow">
                            ${imageHtml}
                            <div class="card-body">
                                <h5 class="card-title">${property.title}</h5>
                                <p class="card-text text-muted">${property.location}</p>
                                <p class="card-text"><strong>₹${property.pricePerNight}</strong> per night</p>
                                <p class="card-text"><small>${property.bedrooms} beds • ${property.maxGuests} guests</small></p>
                            </div>
                            <div class="card-footer bg-white text-center border-0">
                                <button class="btn btn-outline-primary" onclick="viewProperty(${property.id})">
                                    View Details
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // Handle search form submission
        document.getElementById('searchForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const locationInput = document.getElementById('searchLocation').value.trim().toLowerCase();
            const guestsInput = document.getElementById('searchGuests').value;

            let filtered = allProperties;

            // Filter by location
            if (locationInput) {
                filtered = filtered.filter(p => 
                    p.location.toLowerCase().includes(locationInput)
                );
            }

            // Filter by number of guests
            if (guestsInput) {
                const guests = parseInt(guestsInput);
                filtered = filtered.filter(p => p.maxGuests >= guests);
            }

            displayProperties(filtered);
        });

        // View property details
        function viewProperty(id) {
            window.location.href = '/property-detail.html?id=' + id;
        }

        // Load properties when page opens
        loadAllProperties();
    </script>
</body>
</html>
