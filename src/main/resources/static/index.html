<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb Clone - Find Your Stay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .property-card {
            transition: transform 0.3s;
            cursor: pointer;
        }
        .property-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .property-img {
            height: 250px;
            object-fit: cover;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }
        .fallback-img {
            height: 250px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Airbnb Clone</a>
            <div class="d-flex">
                <a href="/login.html" class="btn btn-outline-light me-2">Login</a>
                <a href="/register.html" class="btn btn-light">Sign Up</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="bg-primary text-white py-5 text-center">
        <div class="container">
            <h1 class="display-4">Find Your Perfect Stay</h1>
            <p class="lead">Discover amazing places to stay around the world</p>
        </div>
    </div>

    <!-- Properties Grid -->
    <div class="container my-5">
        <h2 class="text-center mb-4">Available Properties</h2>
        <div class="row" id="propertiesContainer">
            <div class="text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadProperties() {
            try {
                const response = await fetch('/api/properties/all');
                const properties = await response.json();

                const container = document.getElementById('propertiesContainer');
                container.innerHTML = '';

                if (properties.length === 0) {
                    container.innerHTML = '<div class="text-center"><h4>No properties listed yet. Be the first host!</h4></div>';
                    return;
                }

                properties.forEach(property => {
                    // Use real image if available, otherwise fallback
                    const imageHtml = property.imageUrl 
                        ? `<img src="${property.imageUrl}" class="property-img card-img-top" alt="${property.title}">`
                        : `<div class="fallback-img">${property.title.substring(0, 2).toUpperCase()}</div>`;

                    const card = `
                        <div class="col-md-4 mb-4">
                            <div class="card property-card h-100 shadow">
                                ${imageHtml}
                                <div class="card-body">
                                    <h5 class="card-title">${property.title}</h5>
                                    <p class="card-text text-muted">${property.location}</p>
                                    <p class="card-text"><strong>₹${property.pricePerNight}</strong> per night</p>
                                    <p class="card-text"><small>${property.bedrooms} beds • ${property.maxGuests} guests</small></p>
                                </div>
                                <div class="card-footer bg-white text-center border-0">
                                    <button class="btn btn-outline-primary" onclick="viewProperty(${property.id})">
                                        View Details
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    container.innerHTML += card;
                });

            } catch (err) {
                container.innerHTML = '<div class="alert alert-danger">Error loading properties. Please try again.</div>';
            }
        }

        function viewProperty(id) {
            window.location.href = '/property-detail.html?id=' + id;
        }

        loadProperties();
    </script>
</body>
</html>
