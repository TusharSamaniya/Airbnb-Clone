<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Airbnb Clone Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">Airbnb Clone</a>
            <a href="/" class="btn btn-outline-light">Back to Home</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">Connect With Me 👋</h2>
                        <p class="text-center text-muted mb-5">
                            I'm the developer behind this Airbnb Clone project.<br>
                            Feel free to reach out for collaboration, feedback, or opportunities!
                        </p>

                        <form id="contactForm">
                            <div class="mb-3">
                                <label class="form-label">Your Name</label>
                                <input type="text" class="form-control" id="name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Your Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Subject</label>
                                <input type="text" class="form-control" id="subject" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Message</label>
                                <textarea class="form-control" id="message" rows="6" required></textarea>
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn btn-danger btn-lg px-5">
                                    Send Message
                                </button>
                            </div>

                            <div id="contactMessage" class="mt-4 text-center"></div>
                        </form>
                    </div>
                </div>

                <div class="text-center mt-5">
                    <p class="text-muted">
                        <strong>Technologies Used:</strong> Spring Boot • MySQL • Bootstrap • HTML/CSS/JS
                    </p>
                    <p>Made with ❤️ for learning and portfolio</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load footer
        fetch('/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            });

        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                subject: document.getElementById('subject').value,
                message: document.getElementById('message').value
            };

            try {
                const response = await fetch('/api/contact/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    document.getElementById('contactMessage').innerHTML = 
                        '<div class="alert alert-success">Thank you! Your message has been sent successfully. I will reply soon! ❤️</div>';
                    document.getElementById('contactForm').reset();
                } else {
                    const error = await response.text();
                    document.getElementById('contactMessage').innerHTML = 
                        `<div class="alert alert-danger">Error: ${error}</div>`;
                }
            } catch (err) {
                document.getElementById('contactMessage').innerHTML = 
                    '<div class="alert alert-danger">Network error. Please try again.</div>';
            }
        });
    </script>
</body>
</html>
