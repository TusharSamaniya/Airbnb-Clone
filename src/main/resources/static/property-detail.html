<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Details - Airbnb Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .property-main-image {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .fallback-image {
            height: 500px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 5rem;
            font-weight: bold;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .detail-item {
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">Airbnb Clone</a>
            <div>
                <a href="/dashboard.html" class="btn btn-outline-light me-2">Dashboard</a>
                <a href="/" class="btn btn-outline-light">Back to Home</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <!-- Main Property Image -->
        <div id="mainImageContainer">
            <!-- Filled by JavaScript -->
        </div>

        <div class="row">
            <!-- Main Details -->
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-body">
                        <h1 class="card-title" id="title"></h1>
                        <p class="lead text-muted" id="location"></p>
                        <hr>

                        <div class="detail-item">
                            <h5>Description</h5>
                            <p id="description" class="text-muted"></p>
                        </div>

                        <div class="row">
                            <div class="col-md-6 detail-item">
                                <strong>Price per Night:</strong>
                                <span class="text-success fs-4 ms-2" id="price"></span>
                            </div>
                            <div class="col-md-6 detail-item">
                                <strong>Hosted by:</strong>
                                <span class="ms-2" id="hostName"></span>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 detail-item">
                                <strong>Bedrooms:</strong> <span id="bedrooms"></span>
                            </div>
                            <div class="col-md-4 detail-item">
                                <strong>Bathrooms:</strong> <span id="bathrooms"></span>
                            </div>
                            <div class="col-md-4 detail-item">
                                <strong>Max Guests:</strong> <span id="maxGuests"></span>
                            </div>
                        </div>

                        <div class="detail-item">
                            <strong>Amenities:</strong>
                            <span id="amenities" class="ms-2"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Booking Sidebar -->
            <div class="col-lg-4">
                <div class="card shadow sticky-top" style="top: 100px;">
                    <div class="card-body">
                        <h4 class="text-center mb-4">
                            ₹<span id="priceSidebar"></span> <small class="text-muted">/ night</small>
                        </h4>

                        <form id="bookingForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Check-in Date</label>
                                <input type="date" class="form-control" id="checkIn" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Check-out Date</label>
                                <input type="date" class="form-control" id="checkOut" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">Number of Guests</label>
                                <input type="number" class="form-control" id="bookingGuests" min="1" placeholder="1" required>
                            </div>

                            <button type="submit" class="btn btn-danger btn-lg w-100 mb-3">
                                Book Now
                            </button>

                            <div id="bookingMessage" class="text-center"></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
        <!-- Footer -->
<div id="footer-container"></div>

<script>
    // Load footer dynamically
    fetch('/footer.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('footer-container').innerHTML = data;
        });
</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const propertyId = urlParams.get('id');

        let property = null;  // Will hold the loaded property

        if (!propertyId) {
            alert('No property selected!');
            window.location.href = '/';
        }

        async function loadProperty() {
            try {
                const response = await fetch(`/api/properties/${propertyId}`);
                if (!response.ok) throw new Error('Property not found');

                property = await response.json();

                // Set main image
                const imageContainer = document.getElementById('mainImageContainer');
                if (property.imageUrl) {
                    imageContainer.innerHTML = `<img src="${property.imageUrl}" class="property-main-image" alt="${property.title}">`;
                } else {
                    imageContainer.innerHTML = `
                        <div class="fallback-image">
                            ${property.title.substring(0, 2).toUpperCase()}
                        </div>`;
                }

                // Fill all details
                document.getElementById('title').textContent = property.title;
                document.getElementById('location').textContent = property.location;
                document.getElementById('description').textContent = property.description || 'No description available.';
                document.getElementById('price').textContent = property.pricePerNight;
                document.getElementById('priceSidebar').textContent = property.pricePerNight;
                document.getElementById('bedrooms').textContent = property.bedrooms;
                document.getElementById('bathrooms').textContent = property.bathrooms || 'Not specified';
                document.getElementById('maxGuests').textContent = property.maxGuests;
                document.getElementById('amenities').textContent = property.amenities || 'None listed';
                document.getElementById('hostName').textContent = property.host.fullName;

            } catch (err) {
                alert('Error: ' + err.message);
                window.location.href = '/';
            }
        }

        // Real booking submission to backend
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const checkIn = document.getElementById('checkIn').value;
            const checkOut = document.getElementById('checkOut').value;
            const guests = parseInt(document.getElementById('bookingGuests').value);

            // Client-side validation
            if (!checkIn || !checkOut || isNaN(guests)) {
                showBookingMessage('Please fill all fields.', 'danger');
                return;
            }

            if (new Date(checkOut) <= new Date(checkIn)) {
                showBookingMessage('Check-out must be after check-in.', 'danger');
                return;
            }

            if (guests > property.maxGuests) {
                showBookingMessage(`Max ${property.maxGuests} guests allowed.`, 'danger');
                return;
            }

            const bookingData = {
                propertyId: property.id,
                checkIn: checkIn,
                checkOut: checkOut,
                guests: guests
            };

            try {
                const response = await fetch('/api/properties/book', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',  // Important: sends session cookie
                    body: JSON.stringify(bookingData)
                });

                if (response.ok) {
                    const booking = await response.json();
                    const nights = daysBetween(checkIn, checkOut);

                    showBookingMessage(`
                        <div class="alert alert-success p-4">
                            <strong>🎉 Booking Confirmed!</strong><br><br>
                            <strong>Booking ID:</strong> ${booking.id}<br>
                            <strong>Dates:</strong> ${formatDate(checkIn)} → ${formatDate(checkOut)}<br>
                            <strong>Nights:</strong> ${nights}<br>
                            <strong>Guests:</strong> ${guests}<br>
                            <strong>Total Amount:</strong> ₹${booking.totalPrice.toLocaleString('en-IN')}<br><br>
                            <em>Thank you for choosing us!</em>
                        </div>
                    `);
                    document.getElementById('bookingForm').reset();
                } else {
                    const error = await response.text();
                    showBookingMessage(error || 'Booking failed. Please try again.', 'danger');
                }
            } catch (err) {
                showBookingMessage('Network error. Please check your connection.', 'danger');
            }
        });

        // Helper functions
        function daysBetween(start, end) {
            const oneDay = 24 * 60 * 60 * 1000;
            return Math.round(Math.abs((new Date(end) - new Date(start)) / oneDay));
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-IN', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
        }

        function showBookingMessage(html) {
            const msgDiv = document.getElementById('bookingMessage');
            msgDiv.innerHTML = html;
        }

        // Load property when page opens
        loadProperty();
    </script>
</body>
</html>
