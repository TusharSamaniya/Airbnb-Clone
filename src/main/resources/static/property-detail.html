<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Details - Airbnb Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .property-image {
            height: 500px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .detail-item {
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">Airbnb Clone</a>
            <div>
                <a href="/dashboard.html" class="btn btn-outline-light me-2">Dashboard</a>
                <a href="/" class="btn btn-outline-light">Back to Home</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <!-- Property Image Placeholder -->
        <div class="property-image" id="propertyInitials"></div>

        <div class="row">
            <!-- Main Details -->
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-body">
                        <h1 class="card-title" id="title"></h1>
                        <p class="lead text-muted" id="location"></p>
                        <hr>

                        <div class="detail-item">
                            <h5>Description</h5>
                            <p id="description" class="text-muted"></p>
                        </div>

                        <div class="row">
                            <div class="col-md-6 detail-item">
                                <strong>Price per Night:</strong>
                                <span class="text-success fs-4 ms-2" id="price"></span>
                            </div>
                            <div class="col-md-6 detail-item">
                                <strong>Hosted by:</strong>
                                <span class="ms-2" id="hostName"></span>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 detail-item">
                                <strong>Bedrooms:</strong> <span id="bedrooms"></span>
                            </div>
                            <div class="col-md-4 detail-item">
                                <strong>Bathrooms:</strong> <span id="bathrooms"></span>
                            </div>
                            <div class="col-md-4 detail-item">
                                <strong>Max Guests:</strong> <span id="maxGuests"></span>
                            </div>
                        </div>

                        <div class="detail-item">
                            <strong>Amenities:</strong>
                            <span id="amenities" class="ms-2"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Booking Sidebar -->
            <div class="col-lg-4">
                <div class="card shadow sticky-top" style="top: 100px;">
                    <div class="card-body text-center">
                        <h4>₹<span id="priceSidebar"></span> / night</h4>
                        <button class="btn btn-danger btn-lg w-100 mt-4" disabled>
                            Booking System Coming Soon!
                        </button>
                        <p class="text-muted mt-3">Full booking feature in next steps</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Get property ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const propertyId = urlParams.get('id');

        if (!propertyId) {
            alert('No property selected!');
            window.location.href = '/';
        }

        // Load property details from API
        async function loadProperty() {
            try {
                const response = await fetch(`/api/properties/${propertyId}`);
                if (!response.ok) throw new Error('Property not found');

                const property = await response.json();

                // Fill all the fields
                document.getElementById('title').textContent = property.title;
                document.getElementById('location').textContent = property.location;
                document.getElementById('description').textContent = property.description || 'No description available.';
                document.getElementById('price').textContent = property.pricePerNight;
                document.getElementById('priceSidebar').textContent = property.pricePerNight;
                document.getElementById('bedrooms').textContent = property.bedrooms;
                document.getElementById('bathrooms').textContent = property.bathrooms || 'Not specified';
                document.getElementById('maxGuests').textContent = property.maxGuests;
                document.getElementById('amenities').textContent = property.amenities || 'None listed';
                document.getElementById('hostName').textContent = property.host.fullName;
                document.getElementById('propertyInitials').textContent = property.title.substring(0, 2).toUpperCase();

            } catch (err) {
                alert('Error: ' + err.message);
                window.location.href = '/';
            }
        }

        loadProperty();
    </script>
</body>
</html>
