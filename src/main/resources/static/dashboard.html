<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Airbnb Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">Airbnb Clone</span>
            <button class="btn btn-outline-light" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-body text-center">
                <h2 id="welcomeMessage"></h2>
                <p><strong>Role:</strong> <span id="userRole"></span></p>
                <hr>
                <p>Welcome to your dashboard! Next, we'll add property listing and search features.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Check if user is logged in
        const currentUser = localStorage.getItem('currentUser');
        if (!currentUser) {
            alert('Please login first!');
            window.location.href = '/login.html';
        } else {
            const user = JSON.parse(currentUser);
            document.getElementById('welcomeMessage').textContent = 'Hello, ' + user.fullName + '!';
            document.getElementById('userRole').textContent = user.role;
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('currentUser');
            fetch('/logout', { method: 'POST', credentials: 'include' }); // Optional: clear session
            alert('Logged out successfully');
            window.location.href = '/login.html';
        });
    </script>
</body>
</html>
