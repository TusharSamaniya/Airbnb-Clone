<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Airbnb Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">Airbnb Clone</span>
            <button class="btn btn-outline-light" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="container mt-5">
        <!-- Welcome Message -->
        <div class="text-center mb-4">
            <h2 id="welcomeMessage"></h2>
            <p><strong>Role:</strong> <span id="userRole"></span></p>
        </div>

        <!-- Show "Add Property" button and form only for HOST -->
        <div id="hostSection" style="display: none;">
            <div class="card shadow mb-4">
                <div class="card-header bg-primary text-white">
                    <h4>List Your Property</h4>
                </div>
                <div class="card-body">
                    <form id="addPropertyForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Title</label>
                                <input type="text" class="form-control" id="title" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Location (City, Country)</label>
                                <input type="text" class="form-control" id="location" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="description" rows="4" required></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Price per Night (₹)</label>
                                <input type="number" class="form-control" id="pricePerNight" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Bedrooms</label>
                                <input type="number" class="form-control" id="bedrooms" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Bathrooms</label>
                                <input type="number" class="form-control" id="bathrooms" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Max Guests</label>
                                <input type="number" class="form-control" id="maxGuests" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Amenities (comma separated)</label>
                                <input type="text" class="form-control" id="amenities" placeholder="WiFi, Kitchen, Pool, Parking">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100">Add Property</button>
                    </form>

                    <div id="propertyMessage" class="mt-3 text-center"></div>
                </div>
            </div>
        </div>

        <!-- Message for Guests -->
        <div id="guestMessage" class="text-center mt-5" style="display: none;">
            <h4>Welcome, Guest! You can browse and book properties soon.</h4>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Get current logged-in user from localStorage
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));

        // If not logged in → go to login
        if (!currentUser) {
            alert('Please login first!');
            window.location.href = '/login.html';
        }

        // Display user info
        document.getElementById('welcomeMessage').textContent = 'Hello, ' + currentUser.fullName + '!';
        document.getElementById('userRole').textContent = currentUser.role;

        // Show correct section based on role
        if (currentUser.role === 'HOST') {
            document.getElementById('hostSection').style.display = 'block';
        } else {
            document.getElementById('guestMessage').style.display = 'block';
        }

        // Handle Add Property Form
        document.getElementById('addPropertyForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();

            const property = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                location: document.getElementById('location').value,
                pricePerNight: parseFloat(document.getElementById('pricePerNight').value),
                bedrooms: parseInt(document.getElementById('bedrooms').value),
                bathrooms: parseInt(document.getElementById('bathrooms').value),
                maxGuests: parseInt(document.getElementById('maxGuests').value),
                amenities: document.getElementById('amenities').value
            };

            try {
            	const response = await fetch('/api/properties/add', {
            	    method: 'POST',
            	    headers: { 'Content-Type': 'application/json' },
            	    credentials: 'include',
            	    body: JSON.stringify(property) // ✅ THIS WAS MISSING
            	});

                if (response.ok) {
                    const savedProperty = await response.json();
                    document.getElementById('propertyMessage').innerHTML = 
                        '<div class="alert alert-success">Property added successfully! ID: ' + savedProperty.id + '</div>';
                    document.getElementById('addPropertyForm').reset();
                } else {
                    const error = await response.text();
                    document.getElementById('propertyMessage').innerHTML = 
                        '<div class="alert alert-danger">Error: ' + error + '</div>';
                }
            } catch (err) {
                document.getElementById('propertyMessage').innerHTML = 
                    '<div class="alert alert-danger">Network error. Try again.</div>';
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('currentUser');
            alert('Logged out successfully');
            window.location.href = '/login.html';
        });
    </script>
</body>
</html>
