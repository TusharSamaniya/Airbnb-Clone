<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Airbnb Clone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">Airbnb Clone</span>
            <button class="btn btn-outline-light" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="container mt-5">
        <!-- Welcome Message -->
        <div class="text-center mb-4">
            <h2 id="welcomeMessage"></h2>
            <p><strong>Role:</strong> <span id="userRole"></span></p>
        </div>

        <!-- Host Section: Add Property Form -->
        <div id="hostSection" style="display: none;">
            <div class="card shadow mb-4">
                <div class="card-header bg-primary text-white">
                    <h4>List Your Property</h4>
                </div>
                <div class="card-body">
                    <form id="addPropertyForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Title</label>
                                <input type="text" class="form-control" id="title" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Location (City, Country)</label>
                                <input type="text" class="form-control" id="location" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="description" rows="4" required></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Price per Night (₹)</label>
                                <input type="number" class="form-control" id="pricePerNight" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Bedrooms</label>
                                <input type="number" class="form-control" id="bedrooms" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Bathrooms</label>
                                <input type="number" class="form-control" id="bathrooms" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Max Guests</label>
                                <input type="number" class="form-control" id="maxGuests" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Amenities (comma separated)</label>
                                <input type="text" class="form-control" id="amenities" placeholder="WiFi, Kitchen, Pool, Parking">
                            </div>
                        </div>

                        <!-- Image Upload Field -->
                        <div class="mb-3">
                            <label class="form-label">Property Image</label>
                            <input type="file" class="form-control" id="image" accept="image/*">
                            <small class="text-muted">Upload a beautiful photo of your property (optional but recommended)</small>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100">Add Property</button>
                    </form>

                    <div id="propertyMessage" class="mt-3 text-center"></div>
                </div>
            </div>
        </div>

        <!-- Guest Message -->
        <div id="guestMessage" class="text-center mt-5" style="display: none;">
            <h4>Welcome, Guest! You can browse and book properties soon.</h4>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Get logged-in user
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));

        if (!currentUser) {
            alert('Please login first!');
            window.location.href = '/login.html';
        }

        // Display user info
        document.getElementById('welcomeMessage').textContent = 'Hello, ' + currentUser.fullName + '!';
        document.getElementById('userRole').textContent = currentUser.role;

        // Show correct section
        if (currentUser.role === 'HOST') {
            document.getElementById('hostSection').style.display = 'block';
        } else {
            document.getElementById('guestMessage').style.display = 'block';
        }

        // Handle form submission with image upload
        document.getElementById('addPropertyForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();

            let imageUrl = '';  // Will hold uploaded image path

            // Step 1: Upload image if selected
            const imageFile = document.getElementById('image').files[0];
            if (imageFile) {
                const formData = new FormData();
                formData.append('image', imageFile);

                try {
                    const uploadResponse = await fetch('/api/properties/upload-image', {
                        method: 'POST',
                        body: formData,
                        credentials: 'include'  // Sends session cookie
                    });

                    if (!uploadResponse.ok) {
                        const errorText = await uploadResponse.text();
                        throw new Error(errorText || 'Image upload failed');
                    }

                    imageUrl = await uploadResponse.text();  // e.g., "/uploads/123456789_photo.jpg"
                    console.log('Image uploaded:', imageUrl);

                } catch (err) {
                    document.getElementById('propertyMessage').innerHTML = 
                        `<div class="alert alert-danger">Image upload failed: ${err.message}</div>`;
                    return;  // Stop if image fails
                }
            }

            // Step 2: Create property object (include imageUrl if uploaded)
            const property = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                location: document.getElementById('location').value,
                pricePerNight: parseFloat(document.getElementById('pricePerNight').value),
                bedrooms: parseInt(document.getElementById('bedrooms').value),
                bathrooms: parseInt(document.getElementById('bathrooms').value),
                maxGuests: parseInt(document.getElementById('maxGuests').value),
                amenities: document.getElementById('amenities').value,
                imageUrl: imageUrl  // ← This sends the image path to backend
            };

            // Step 3: Send property to backend
            try {
                const response = await fetch('/api/properties/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(property)
                });

                if (response.ok) {
                    const savedProperty = await response.json();
                    document.getElementById('propertyMessage').innerHTML = 
                        `<div class="alert alert-success">
                            Property added successfully! ID: ${savedProperty.id}
                            ${imageUrl ? '<br>Image uploaded!' : ''}
                        </div>`;
                    document.getElementById('addPropertyForm').reset();
                } else {
                    const error = await response.text();
                    document.getElementById('propertyMessage').innerHTML = 
                        `<div class="alert alert-danger">Error: ${error}</div>`;
                }
            } catch (err) {
                document.getElementById('propertyMessage').innerHTML = 
                    `<div class="alert alert-danger">Network error: ${err.message}</div>`;
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('currentUser');
            alert('Logged out successfully');
            window.location.href = '/login.html';
        });
    </script>
</body>
</html>
